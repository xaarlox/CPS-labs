<!DOCTYPE html>
<html lang="uk">
<head>
    {% load static %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    {% csrf_token %}
    <title>Симуляція: Балістика (Pro + Matter.js)</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Ubuntu',sans-serif; user-select: none; }

        html, body { 
            height: 100%; 
            overflow: hidden;
            background: #87CEEB; 
        }

        #simcanvas { 
            width: 100vw; 
            height: 100vh; 
            display: block; 
            cursor: crosshair; 
        }

        .angle-indicator {
            position: absolute;
            left: 180px; 
            bottom: 180px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 5px 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            border: 2px solid #2c3e50;
            font-size: 1.5rem;
            font-weight: 700;
            color: #2c3e50;
            text-align: center;
            pointer-events: none;
            z-index: 10;
        }

        .velocity-control-ground {
            position: absolute;
            left: 40px;
            bottom: 20px;
            width: 280px;
            background: #3e5f45;
            border: 3px solid #1a291e;
            border-radius: 10px;
            padding: 10px 15px;
            box-shadow: 0 5px 0 rgba(0,0,0,0.2);
            z-index: 10;
            color: #fff;
        }

        .velocity-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #b8e994;
        }

        .velocity-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .velo-btn {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            background: #555;
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 0 #333;
        }
        .velo-btn:active { transform: translateY(3px); box-shadow: none; }

        .velocity-slider {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            background: #222;
            border-radius: 3px;
            outline: none;
        }
        .velocity-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 24px;
            background: #fdd835;
            border: 2px solid #333;
            cursor: pointer;
            border-radius: 2px;
        }

        .velocity-val {
            font-family: 'Courier New', monospace;
            background: #222;
            color: #0f0;
            padding: 2px 6px;
            border-radius: 4px;
            min-width: 75px;
            text-align: center;
            font-weight: bold;
        }

    
        .main-controls {
            position: fixed;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 20;
            background: rgba(255,255,255,0.8);
            padding: 10px;
            border-radius: 12px;
            border: 2px solid #ccc;
        }

        .btn-main {
            padding: 12px 30px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            color: white;
        }
        .btn-main:active { transform: translateY(4px); box-shadow: none; }

        .btn-fire {
            background: #e74c3c;
            border-bottom: 4px solid #c0392b;
            box-shadow: none;
        }
        .btn-fire:hover { background: #ff6b6b; }

        .btn-reset {
            background: #7f8c8d;
            border-bottom: 4px solid #636e72;
            box-shadow: none;
        }
        .btn-reset:hover { background: #95a5a6; }

        .hud-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #fff;
            border: 3px solid #2c3e50;
            border-radius: 0;
            padding: 15px;
            width: 220px;
            box-shadow: 5px 5px 0 rgba(0,0,0,0.1);
        }
        .hud-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #333;
        }
        .hud-val { font-weight: bold; color: #d35400; }
        .hud-big { font-size: 1.2rem; border-bottom: 2px solid #ddd; padding-bottom: 5px; margin-bottom: 10px; }

        .modal {
            display: none;
            position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            align-items: center; justify-content: center;
        }
        .modal.show { display: flex; }
        .modal-box {
            background: #fff; padding: 30px; border-radius: 8px;
            text-align: center; border: 4px solid #2c3e50;
            box-shadow: 10px 10px 0 rgba(0,0,0,0.2);
            animation: popIn 0.3s ease;
        }
        @keyframes popIn { from {transform: scale(0.5); opacity:0;} to {transform: scale(1); opacity:1;} }
        .grade-big { font-size: 4rem; font-weight: 800; color: #27ae60; margin: 10px 0; }
        .modal-btn {
            background: #2c3e50; color: white; border: none; padding: 12px 30px;
            font-size: 1.1rem; border-radius: 4px; cursor: pointer; margin-top: 20px;
        }

    </style>
</head>
<body data-lab-id="{{ lab.id }}" data-attempts-left="{{ submission.attempts_left }}" data-best-mark="{{ submission.best_mark|default:0 }}">

    <canvas id="simcanvas"></canvas>

    <!-- Індикатор кута -->
    <div class="angle-indicator" id="angle-val">45.0°</div>

    <!-- Контроль швидкості -->
    <div class="velocity-control-ground">
        <div class="velocity-header">
            <span>Потужність (V0)</span>
            <div class="velocity-val" id="vel-val">15.0</div>
        </div>
        <div class="velocity-row">
            <button class="velo-btn" id="vel-dec">-</button>
            <input type="range" class="velocity-slider" id="vel-slider" min="1" max="50" step="0.5" value="15">
            <button class="velo-btn" id="vel-inc">+</button>
        </div>
    </div>

    <!-- Головні кнопки -->
    <div class="main-controls">
        <button class="btn-main btn-reset" id="btn-reset">Скинути</button>
        <button class="btn-main btn-fire" id="btn-fire">ВОГОНЬ</button>
    </div>

    <!-- HUD -->
    <div class="hud-panel">
        <div class="hud-row hud-big">
            <span>Оцінка:</span> <span class="hud-val" id="hud-grade">--</span>
        </div>
        <div class="hud-row">
            <span>Відстань:</span> <span class="hud-val" id="hud-dist">--</span>
        </div>
        <div class="hud-row">
            <span>Спроба:</span> <span class="hud-val" id="hud-attempt">0</span>
        </div>
        <div class="hud-row">
            <span>Рекорд:</span> <span class="hud-val" id="hud-best">∞</span>
        </div>
    </div>

    <!-- Modal -->
    <div id="res-modal" class="modal">
        <div class="modal-box">
            <h2>Результат пострілу</h2>
            <div class="grade-big" id="mod-grade">95</div>
            <div id="mod-msg" style="font-size: 1.2rem; margin-bottom: 10px; font-weight: bold;">Чудово!</div>
            <div style="color: #555;">Похибка: <span id="mod-err" style="color:#000; font-weight:bold;">0.5m</span></div>
            <button class="modal-btn" onclick="document.getElementById('res-modal').classList.remove('show')">Продовжити</button>
        </div>
    </div>


    <!-- Модальне вікно для закінчених спроб -->
    <div id="attempts-over-modal" class="modal">
        <div class="modal-box">
            <h2>Спроби закінчились.</h2>
            <div class="grade-big" style="color: #e74c3c; font-size: 3rem;">Залишених спроб: 0</div>
            <div style="color: #666; line-height: 1.6;">
                Ваш найкращий результат: <strong id="final-best-score">--</strong> балів
            </div>
            <button class="modal-btn" onclick="window.location.href='{% url 'labs' %}'">Повернутися до робіт</button>
        </div>
    </div>

<script>
/* --- MATTER.JS SETUP --- */
const Engine = Matter.Engine,
      Render = Matter.Render,
      Runner = Matter.Runner,
      Bodies = Matter.Bodies,
      Body = Matter.Body,
      Composite = Matter.Composite,
      Events = Matter.Events,
      Vector = Matter.Vector;

/* --- CONFIG & STATE --- */
const TARGET_DIST = 15.0; 
const GRAVITY_SCALE = 1.0; 
const SCALE_BASE = 100; 

let canvas = document.getElementById('simcanvas');
let ctx = canvas.getContext('2d');
let width, height;

// Simulation State
let engine;
let projectileBody = null;
let groundBody = null;

let sim = {
    running: false,
    finished: false,
    path: [],
    lastError: undefined
};

// Controls State
let params = {
    angle: 45,
    v0: 15
};

let stats = {
    attempts: 0,
    best: Infinity,
    grade: 0
};

let drag = { active: false };
let explosions = [];
let clouds = [];

/* --- INIT --- */
function init() {
    engine = Engine.create();
    engine.gravity.y = 1;

    resize();
    window.addEventListener('resize', resize);
    generateClouds();
    loop();
}

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    updatePhysicsWorld();
    draw();
}

function updatePhysicsWorld() {
    Composite.clear(engine.world);
    projectileBody = null; 

    const originY = height - 120;
    
    // Земля (статична)
    groundBody = Bodies.rectangle(width / 2, originY + 50, width * 2, 100, { 
        isStatic: true,
        label: "Ground"
    });
    Composite.add(engine.world, groundBody);

    Events.on(engine, 'collisionStart', handleCollisions);
}

function generateClouds() {
    clouds = [];
    for(let i=0; i<5; i++) {
        clouds.push({
            x: Math.random() * width,
            y: Math.random() * (height/2),
            size: 30 + Math.random() * 50,
            speed: 0.1 + Math.random() * 0.2
        });
    }
}

/* --- PHYSICS & LOOP --- */
function loop() {
    if (sim.running) {
        Engine.update(engine, 1000 / 60);
        
        if (projectileBody) {
            sim.path.push({x: projectileBody.position.x, y: projectileBody.position.y});
            // Виліт за межі
            if (projectileBody.position.x > width + 200 || projectileBody.position.y > height + 200) {
                 stopSim();
            }
        }
    }
    updateVisuals();
    draw();
    requestAnimationFrame(loop);
}

function handleCollisions(event) {
    if (!sim.running) return;

    const pairs = event.pairs;
    for (let i = 0; i < pairs.length; i++) {
        const bodyA = pairs[i].bodyA;
        const bodyB = pairs[i].bodyB;

        if ((bodyA === projectileBody && bodyB === groundBody) || 
            (bodyB === projectileBody && bodyA === groundBody)) {
            
            stopSim();
        }
    }
}

function updateVisuals() {
    clouds.forEach(c => {
        c.x += c.speed;
        if(c.x > width + 100) c.x = -100;
    });

    for (let i = explosions.length - 1; i >= 0; i--) {
        let p = explosions[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;
        if(p.life <= 0) explosions.splice(i, 1);
    }
}

/* --- DRAWING --- */
function draw() {
    let grd = ctx.createLinearGradient(0, 0, 0, height);
    grd.addColorStop(0, "#4facfe");
    grd.addColorStop(1, "#00f2fe");
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, width, height);

    ctx.fillStyle = "rgba(255,255,255,0.6)";
    clouds.forEach(c => {
        drawCloud(c.x, c.y, c.size);
    });

    const originX = 150;
    const originY = height - 120;
    let wFactor = (width - 100) / (TARGET_DIST + 2);
    if (wFactor < 10) wFactor = 10;
    const pxPerMeter = Math.min(SCALE_BASE, wFactor);

    function toScreenX(mX) { return originX + mX * pxPerMeter; }
    function toScreenY(mY) { return originY - mY * pxPerMeter; }

    // Ground
    ctx.fillStyle = "#27ae60"; 
    ctx.fillRect(0, originY, width, height - originY);
    ctx.fillStyle = "#2ecc71"; 
    ctx.fillRect(0, originY, width, 15);
    
    // Markers
    ctx.fillStyle = "rgba(255,255,255,0.6)";
    ctx.font = "14px Ubuntu";
    ctx.textAlign = "center";
    for(let i=5; i<=TARGET_DIST+5; i+=5) {
        if(i === TARGET_DIST) continue;
        let x = toScreenX(i);
        ctx.fillRect(x-1, originY, 2, 12);
        ctx.fillText(i+"m", x, originY + 28);
    }

    // Target (Flat on Ground)
    drawTarget(toScreenX(TARGET_DIST), originY, pxPerMeter);

    // Trajectory
    if (sim.path.length > 1) {
        ctx.beginPath();
        ctx.strokeStyle = "white";
        ctx.lineWidth = 3;
        ctx.setLineDash([8, 8]);
        ctx.moveTo(sim.path[0].x, sim.path[0].y);
        for(let p of sim.path) ctx.lineTo(p.x, p.y);
        ctx.stroke();
        ctx.setLineDash([]);
    }

    // Cannon
    drawCannon(originX, originY, params.angle, pxPerMeter);
    
    if (drag.active) {
        ctx.beginPath();
        ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
        ctx.lineWidth = 2;
        ctx.arc(originX, originY, 120, -Math.PI/2, 0);
        ctx.stroke();
    }

    // Projectile
    if (projectileBody) {
        const pos = projectileBody.position;
        ctx.beginPath();
        ctx.fillStyle = "#2c3e50";
        ctx.arc(pos.x, pos.y, pxPerMeter * 0.15, 0, Math.PI*2);
        ctx.fill();
    }

    // Explosions
    explosions.forEach(p => {
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
    });
}

function drawCloud(x, y, s) {
    ctx.beginPath();
    ctx.arc(x, y, s, 0, Math.PI * 2);
    ctx.arc(x + s * 0.8, y - s * 0.4, s * 0.9, 0, Math.PI * 2);
    ctx.arc(x + s * 1.5, y, s * 0.8, 0, Math.PI * 2);
    ctx.fill();
}

function drawCannon(x, y, angleDeg, scale) {
    ctx.save();
    ctx.translate(x, y); 
    ctx.fillStyle = "#2c3e50";
    ctx.beginPath();
    ctx.arc(0, 10, 25 * (scale/60), 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = "#556b2f"; 
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(-30 * (scale/60), 20 * (scale/60));
    ctx.lineTo(30 * (scale/60), 20 * (scale/60));
    ctx.fill();
    ctx.save();
    ctx.rotate(-angleDeg * Math.PI / 180);
    const barrelW = 90 * (scale/60);
    const barrelH = 20 * (scale/60);
    ctx.fillStyle = "#34495e";
    ctx.fillRect(-10, -barrelH/2, barrelW, barrelH); 
    if(drag.active) {
        ctx.strokeStyle = "rgba(255,255,0,0.5)";
        ctx.lineWidth = 2;
        ctx.strokeRect(-10, -barrelH/2, barrelW, barrelH);
    }
    ctx.fillStyle = "#2c3e50";
    ctx.fillRect(barrelW - 15, -(barrelH/2)-2, 15, barrelH+4);
    ctx.restore();
    ctx.beginPath();
    ctx.fillStyle = "#34495e";
    ctx.arc(0, 10, 25 * (scale/60), 0, Math.PI*2); 
    ctx.fill();
    ctx.beginPath();
    ctx.strokeStyle = "#95a5a6";
    ctx.lineWidth = 4;
    ctx.arc(0, 10, 22 * (scale/60), 0, Math.PI*2);
    ctx.stroke();
    ctx.fillStyle = "#ecf0f1";
    ctx.beginPath();
    ctx.arc(0, 10, 6, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
}

function drawTarget(x, y, scale) {

    const radiusX = 1.0 * scale; // 1 метр радіус по X
    const radiusY = 0.2 * scale; // Сплюснутий по Y для 3D ефекту

    // Зовнішнє кільце (Червоне)
    ctx.beginPath();
    ctx.ellipse(x, y, radiusX, radiusY, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#e74c3c";
    ctx.fill();
    ctx.strokeStyle = "#c0392b";
    ctx.stroke();

    // Середнє кільце (Біле)
    ctx.beginPath();
    ctx.ellipse(x, y, radiusX * 0.66, radiusY * 0.66, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#ecf0f1";
    ctx.fill();

    // Центр (Червоний)
    ctx.beginPath();
    ctx.ellipse(x, y, radiusX * 0.33, radiusY * 0.33, 0, 0, Math.PI * 2);
    ctx.fillStyle = "#e74c3c";
    ctx.fill();

    // Підпис "15.0 м"
    ctx.fillStyle = "white";
    ctx.fillRect(x - 30, y + 20, 60, 24);
    ctx.strokeStyle = "#333";
    ctx.lineWidth = 2;
    ctx.strokeRect(x - 30, y + 20, 60, 24);
    ctx.fillStyle = "#333";
    ctx.textAlign = "center";
    ctx.font = "bold 16px Ubuntu";
    ctx.fillText(TARGET_DIST+"m", x, y + 38);
}

/* --- LOGIC --- */

function fire() {
    if (sim.running) return;
    
    // Перевіряємо ліміт спроб
    const attemptsLeft = parseInt(document.body.dataset.attemptsLeft) || 0;
    if (attemptsLeft <= 0) {
        const bestMark = parseFloat(document.body.dataset.bestMark) || 0;
        document.getElementById('final-best-score').innerText = Math.round(bestMark);
        document.getElementById('attempts-over-modal').classList.add('show');
        return;
    }
    
    if (projectileBody) Composite.remove(engine.world, projectileBody);

    sim.running = true;
    sim.finished = false;
    sim.path = [];

    const originX = 150;
    const originY = height - 120;
    
    let wFactor = (width - 100) / (TARGET_DIST + 2);
    if (wFactor < 10) wFactor = 10;
    const pxPerMeter = Math.min(SCALE_BASE, wFactor);

    const rad = params.angle * Math.PI / 180;
    const barrelLen = 90 * (pxPerMeter/60);
    
    const startX = originX + Math.cos(rad) * barrelLen;
    const startY = originY - Math.sin(rad) * barrelLen;

    projectileBody = Bodies.circle(startX, startY, pxPerMeter * 0.15, {
        label: "Projectile",
        frictionAir: 0.005, 
        restitution: 0.2,   
        density: 0.004      
    });

    const velocityScale = 0.018 * pxPerMeter; 
    const vx = params.v0 * Math.cos(rad) * velocityScale;
    const vy = -params.v0 * Math.sin(rad) * velocityScale;

    Body.setVelocity(projectileBody, { x: vx, y: vy });
    Composite.add(engine.world, projectileBody);
}

function stopSim() {
    sim.running = false;
    sim.finished = true;
    
    // Де впав снаряд?
    let endX = projectileBody ? projectileBody.position.x : 0;
    let endY = projectileBody ? projectileBody.position.y : 0;
    
    // Рахуємо похибку
    const originX = 150;
    let wFactor = (width - 100) / (TARGET_DIST + 2);
    if (wFactor < 10) wFactor = 10;
    const pxPerMeter = Math.min(SCALE_BASE, wFactor);
    
    // Ціль знаходиться на TARGET_DIST метрів від гармати
    const landingDistMeters = (endX - originX) / pxPerMeter;
    const errorDist = Math.abs(landingDistMeters - TARGET_DIST);
    
    // Визначаємо, чи було візуальне влучання (радіус ~1м)
    const isHit = errorDist < 1.0;

    // Створюємо вибух
    const color = isHit ? '#f1c40f' : '#95a5a6';
    const count = isHit ? 50 : 20;
    for(let i=0; i<count; i++) {
        explosions.push({
            x: endX, y: endY,
            vx: (Math.random()-0.5)*10,
            vy: (Math.random()-0.5)*10,
            life: 1.0,
            size: Math.random()*5 + 2,
            color: color
        });
    }

    sim.lastError = errorDist;
    
    // АВТОМАТИЧНА ОЦІНКА
    calculateScore();
}

function calculateScore() {
    if (!sim.finished) return;
    
    let dist = sim.lastError;
    stats.attempts++;
    if(dist < stats.best) stats.best = dist;

    let score = 0;
    let msg = "Промах";
    
    // Критерії оцінки
    if (dist < 0.2) { score = 100; msg = "ІДЕАЛЬНО!"; }
    else if (dist < 0.5) { score = 95; msg = "Відмінно"; }
    else if (dist < 1.0) { score = 85; msg = "Влучив!"; }
    else if (dist < 2.0) { score = 70; msg = "Поруч"; }
    else { score = 50; msg = "Спробуй ще"; }

    document.getElementById('hud-grade').innerText = score + "/100";
    document.getElementById('hud-dist').innerText = dist.toFixed(2) + "m";
    document.getElementById('hud-attempt').innerText = stats.attempts;
    document.getElementById('hud-best').innerText = stats.best.toFixed(2) + "m";

    document.getElementById('mod-grade').innerText = score;
    document.getElementById('mod-msg').innerText = msg;
    document.getElementById('mod-err').innerText = dist.toFixed(2) + "m";
    
    // Відправляємо результат на сервер
    submitResultToServer(score, dist);
    
    // Показуємо результат через 200мс для плавності
    setTimeout(() => {
        document.getElementById('res-modal').classList.add('show');
    }, 200);
}

// Функція для відправки результату на сервер
function submitResultToServer(score, errorDist) {
    // Отримуємо CSRF токен
    const csrfToken = getCookie('csrftoken');
    const originX = 150;
    let wFactor = (width - 100) / (TARGET_DIST + 2);
    if (wFactor < 10) wFactor = 10;
    const pxPerMeter = Math.min(SCALE_BASE, wFactor);
    
    const landingDistMeters = (projectileBody ? projectileBody.position.x - originX : 0) / pxPerMeter;
    
    const resultData = {
        lab_id: document.body.dataset.labId,
        score: score,
        error_distance: errorDist.toFixed(2),
        angle: params.angle.toFixed(1),
        velocity: params.v0.toFixed(1),
        distance: landingDistMeters.toFixed(2)
    };
    
    fetch('/api/submit-ballistics/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken
        },
        body: JSON.stringify(resultData)
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            console.log('Результат успішно відправлений:', data);
            document.getElementById('hud-attempt').innerText = stats.attempts;
            // Оновлюємо ліміт спроб та найкращий результат
            document.body.dataset.attemptsLeft = data.attempts_left;
            if (data.best_mark !== undefined) {
                document.body.dataset.bestMark = data.best_mark;
            }
        } else {
            console.error('Помилка відправки:', data.error);
        }
    })
    .catch(error => console.error('Помилка:', error));
}

// Функція для отримання CSRF токена з cookies
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

function reset() {
    sim.running = false;
    sim.finished = false;
    sim.path = [];
    if(projectileBody) Composite.remove(engine.world, projectileBody);
    projectileBody = null;
    draw();
}

/* --- EVENT LISTENERS --- */

canvas.addEventListener('mousedown', (e) => {
    const originX = 150;
    const originY = height - 120;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    const dist = Math.sqrt((mx - originX)**2 + (my - originY)**2);
    
    if (dist < 150) {
        drag.active = true;
        updateAngleFromMouse(mx, my);
    }
});

window.addEventListener('mousemove', (e) => {
    if (!drag.active) return;
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;
    updateAngleFromMouse(mx, my);
});

window.addEventListener('mouseup', () => {
    drag.active = false;
    draw();
});

function updateAngleFromMouse(mx, my) {
    const originX = 150;
    const originY = height - 120;
    const dx = mx - originX;
    const dy = originY - my;
    let angle = Math.atan2(dy, dx) * 180 / Math.PI;
    angle = Math.max(0, Math.min(90, angle));
    params.angle = angle;
    document.getElementById('angle-val').innerText = angle.toFixed(1) + "°";
    draw();
}

document.getElementById('btn-fire').addEventListener('click', fire);
document.getElementById('btn-reset').addEventListener('click', reset);

const velDisp = document.getElementById('vel-val');
const velSlider = document.getElementById('vel-slider');
function updateVel(v) {
    params.v0 = parseFloat(v);
    velSlider.value = params.v0;
    velDisp.innerText = params.v0.toFixed(1);
}
velSlider.addEventListener('input', (e) => updateVel(e.target.value));
document.getElementById('vel-inc').addEventListener('click', () => updateVel(Math.min(50, params.v0 + 0.5)));
document.getElementById('vel-dec').addEventListener('click', () => updateVel(Math.max(1, params.v0 - 0.5)));

window.addEventListener('keydown', (e) => {
    if(e.code === 'Space') fire();
    if(e.key.toLowerCase() === 'r') reset();
});

init();

</script>
